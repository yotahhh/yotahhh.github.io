drop":"none"},"pin_options":{},"overlay_options":{},"thumb_media_id":null,"thumbnail":null,"thumb_meta":[],"media":[],"tags":[],"access_level":"public"},"I3963729310":{"id":"I3963729310","title":"Main scroll","purl":"main-scroll","page_type":"page","content":"\u003ccolumn-set gutter=\"2.5rem\" mobile-gutter=\"2rem\" mobile-stack=\"true\">\n\u003ccolumn-unit slot=\"0\" span=\"5\">\u003ca class=\"cover-link\" href=\"slow-brained-remix\" rel=\"history\">\u003cimg class=\"cover\" src=\"/images/slow_brained_remix.jpg\" alt=\"Slow Brained (Yotah Remix)\" width=\"1200\" height=\"1200\" loading=\"lazy\" />\u003c/a>\u003c/column-unit>\n\u003ccolumn-unit slot=\"1\" span=\"7\">\u003ch2 style=\"--font-scale: 0.5;\">\u003ca href=\"slow-brained-remix\" rel=\"history\">Slow Brained (Yotah Remix)\u003c/a>\u003c/h2>\n\u003cbr />\u003cspan class=\"caption\">Ethos Records · 1 track\u003c/span>\n\u003cbr />\nA remix of Flower B's \"Slow Brained\", featured on \"Flagrant Déni\" — breaks, jungle and techno by Ethos Records.\u003cbr />\n\u003cbr />\n\u003ciframe class=\"embed embed-bandcamp\" src=\"https://bandcamp.com/EmbeddedPlayer/track=533839500/size=small/bgcol=0d0d0d/linkcol=ffffff/transparent=true/\" title=\"Slow Brained (Yotah Remix) — Bandcamp player\" loading=\"lazy\">\u003c/iframe>\n\u003cbr />\n\u003ca class=\"button\" href=\"slow-brained-remix\" rel=\"history\">Full release →\u003c/a>\u003c/column-unit>\n\u003c/column-set>\u003cbr />\n\u003cbr />\n\u003chr />\u003cbr />\n\u003ccolumn-set gutter=\"2.5rem\" mobile-gutter=\"2rem\" mobile-stack=\"true\">\n\u003ccolumn-unit slot=\"0\" span=\"5\">\u003ca class=\"cover-link\" href=\"5ug\" rel=\"history\">\u003cimg class=\"cover\" src=\"/images/5ug.jpg\" alt=\"5μg\" width=\"1200\" height=\"1200\" loading=\"lazy\" />\u003c/a>\u003c/column-unit>\n\u003ccolumn-unit slot=\"1\" span=\"7\">\u003ch2 style=\"--font-scale: 0.5;\">\u003ca href=\"5ug\" rel=\"history\">5μg\u003c/a>\u003c/h2>\n\u003cbr />\u003cspan class=\"caption\">sama recordings · 1 track\u003c/span>\n\u003cbr />\nFeatured on \"Idiosyncratic Bass Music Vol. 1\", a compilation of leftfield and experimental bass music from sama recordings.\u003cbr />\n\u003cbr />\n\u003ciframe class=\"embed embed-bandcamp\" src=\"https://bandcamp.com/EmbeddedPlayer/track=2213514743/size=small/bgcol=0d0d0d/linkcol=ffffff/transparent=true/\" title=\"5μg — Bandcamp player\" loading=\"lazy\">\u003c/iframe>\n\u003cbr />\n\u003ca class=\"button\" href=\"5ug\" rel=\"history\">Full release →\u003c/a>\u003c/column-unit>\n\u003c/column-set>\u003cbr />\n\u003cbr />\n\u003chr />\u003cbr />\n\u003ccolumn-set gutter=\"2.5rem\" mobile-gutter=\"2rem\" mobile-stack=\"true\">\n\u003ccolumn-unit slot=\"0\" span=\"5\">\u003ca class=\"cover-link\" href=\"forever-chemicals\" rel=\"history\">\u003cimg class=\"cover\" src=\"/images/waystation_sequence_ii.jpg\" alt=\"Forever Chemicals\" width=\"1200\" height=\"1200\" loading=\"lazy\" />\u003c/a>\u003c/column-unit>\n\u003ccolumn-unit slot=\"1\" span=\"7\">\u003ch2 style=\"--font-scale: 0.5;\">\u003ca href=\"forever-chemicals\" rel=\"history\">Forever Chemicals\u003c/a>\u003c/h2>\n\u003cbr />\u003cspan class=\"caption\">Nostro Hood System · 1 track\u003c/span>\n\u003cbr />\nFeatured on \"Waystation: Sequence II\" by Nostro Hood System. Returning to the Waystation once again, Sequence II is another snapshot of this moment in time, where fourteen audio artists present their works for the Nostro Hood.\u003cbr />\n\u003cbr />\n\u003ciframe class=\"embed embed-bandcamp\" src=\"https://bandcamp.com/EmbeddedPlayer/track=372559100/size=small/bgcol=0d0d0d/linkcol=ffffff/transparent=true/\" title=\"Forever Chemicals — Bandcamp player\" loading=\"lazy\">\u003c/iframe>\n\u003cbr />\n\u003ca class=\"button\" href=\"forever-chemicals\" rel=\"history\">Full release →\u003c/a>\u003c/column-unit>\n\u003c/column-set>\u003cbr />\n\u003cbr />\n\u003chr />\u003cbr />\n\u003ccolumn-set gutter=\"2.5rem\" mobile-gutter=\"2rem\" mobile-stack=\"true\">\n\u003ccolumn-unit slot=\"0\" span=\"5\">\u003ca class=\"cover-link\" href=\"true-bug\" rel=\"history\">\u003cimg class=\"cover\" src=\"/images/true_bug.jpg\" alt=\"True Bug EP\" width=\"1200\" height=\"1200\" loading=\"lazy\" />\u003c/a>\u003c/column-unit>\n\u003ccolumn-unit slot=\"1\" span=\"7\">\u003ch2 style=\"--font-scale: 0.5;\">\u003ca href=\"true-bug\" rel=\"history\">True Bug EP\u003c/a>\u003c/h2>\n\u003cbr />\u003cspan class=\"caption\">CRTTR · 4 tracks\u003c/span>\n\u003cbr />\nFour tracks for the late shift. Clubby bass music with experimental edges, made for those hours when things get weird and heavy.\u003cbr />\n\u003cbr />\n\u003ciframe class=\"embed embed-bandcamp\" src=\"https://bandcamp.com/EmbeddedPlayer/album=1857918484/size=small/bgcol=0d0d0d/linkcol=ffffff/transparent=true/\" title=\"True Bug EP — Bandcamp player\" loading=\"lazy\">\u003c/iframe>\n\u003cbr />\n\u003ca class=\"button\" href=\"true-bug\" rel=\"history\">Full release →\u003c/a>\u003c/column-unit>\n\u003c/column-set>\u003cbr />\n\u003cbr />\n\u003chr />\u003cbr />\n\u003ccolumn-set gutter=\"2.5rem\" mobile-gutter=\"2rem\" mobile-stack=\"true\">\n\u003ccolumn-unit slot=\"0\" span=\"5\">\u003ca class=\"cover-link\" href=\"no-time-to-waste\" rel=\"history\">\u003cimg class=\"cover\" src=\"/images/no_time_to_waste.jpg\" alt=\"No Time To Waste\" width=\"700\" height=\"700\" loading=\"lazy\" />\u003c/a>\u003c/column-unit>\n\u003ccolumn-unit slot=\"1\" span=\"7\">\u003ch2 style=\"--font-scale: 0.5;\">\u003ca href=\"no-time-to-waste\" rel=\"history\">No Time To Waste\u003c/a>\u003c/h2>\n\u003cbr />\u003cspan class=\"caption\">CRTTR · 1 track\u003c/span>\n\u003cbr />\nFeatured on \"I Wanna Be A Superstar Vol. 1\" by CRTTR, a collective based in Bern, Switzerland—a mutation with many faces, unfolding through sound, image, and genre-fluid collaborative play.\u003cbr />\n\u003cbr />\n\u003ciframe class=\"embed embed-bandcamp\" src=\"https://bandcamp.com/EmbeddedPlayer/track=1651140496/size=small/bgcol=0d0d0d/linkcol=ffffff/transparent=true/\" title=\"No Time To Waste — Bandcamp player\" loading=\"lazy\">\u003c/iframe>\n\u003cbr />\n\u003ca class=\"button\" href=\"no-time-to-waste\" rel=\"history\">Full release →\u003c/a>\u003c/column-unit>\n\u003c/column-set>\u003cbr />\n\u003cbr />\n\u003chr />\u003cbr />\n\u003ccolumn-set gutter=\"2.5rem\" mobile-gutter=\"2rem\" mobile-stack=\"true\">\n\u003ccolumn-unit slot=\"0\" span=\"5\">\u003ca class=\"cover-link\" href=\"rewiring\" rel=\"history\">\u003cimg class=\"cover\" src=\"/images/rewiring.jpg\" alt=\"Rewiring EP\" width=\"500\" height=\"500\" loading=\"lazy\" />\u003c/a>\u003c/column-unit>\n\u003ccolumn-unit slot=\"1\" span=\"7\">\u003ch2 style=\"--font-scale: 0.5;\">\u003ca href=\"rewiring\" rel=\"history\">Rewiring EP\u003c/a>\u003c/h2>\n\u003cbr />\u003cspan class=\"caption\">Nostro Hood System · 4 tracks\u003c/span>\n\u003cbr />\nNHS's twentieth release introduces a newcomer, Yotah, with their debut EP \"Rewiring.\" The project features four tracks that teeter on the fringes of chunky maximalism and intricate, evolving modulation. The work explores hybridized and amorphous sonics into recognizable patterns, only to break through this consolidation to peer into the unknown that lurks on the other side.\u003cbr />\n\u003cbr />\n\u003ciframe class=\"embed embed-bandcamp\" src=\"https://bandcamp.com/EmbeddedPlayer/album=2696578243/size=small/bgcol=0d0d0d/linkcol=ffffff/transparent=true/\" title=\"Rewiring EP — Bandcamp player\" loading=\"lazy\">\u003c/iframe>\n\u003cbr />\n\u003ca class=\"button\" href=\"rewiring\" rel=\"history\">Full release →\u003c/a>\u003c/column-unit>\n\u003c/column-set>\u003cbr />\n\u003cbr />\n\u003chr />\u003cbr />\n\u003ccolumn-set gutter=\"2.5rem\" mobile-gutter=\"2rem\" mobile-stack=\"true\">\n\u003ccolumn-unit slot=\"0\" span=\"5\">\u003ca class=\"cover-link\" href=\"spring-remix\" rel=\"history\">\u003cimg class=\"cover\" src=\"/images/spring_remix.jpg\" alt=\"Spring (Yotah's Healing Remix)\" width=\"1200\" height=\"1200\" loading=\"lazy\" />\u003c/a>\u003c/column-unit>\n\u003ccolumn-unit slot=\"1\" span=\"7\">\u003ch2 style=\"--font-scale: 0.5;\">\u003ca href=\"spring-remix\" rel=\"history\">Spring (Yotah's Healing Remix)\u003c/a>\u003c/h2>\n\u003cbr />\u003cspan class=\"caption\">1 track\u003c/span>\n\u003cbr />\nI was captivated by the original track's 'airy' feel, particularly in the vocals and the overall mix. The rhythmic patterns were so intricate and refined that I didn't dare touch them. Instead, I focused on translating that spacey, airy vibe into a spherical drone. My goal was to create something reminiscent of lying on the grass on a warm day, watching clouds drift by – a healing sensation I tend to forget during long winters and rediscover each spring.\u003cbr />\n\u003cbr />\n\u003ciframe class=\"embed embed-bandcamp\" src=\"https://bandcamp.com/EmbeddedPlayer/track=2017843626/size=small/bgcol=0d0d0d/linkcol=ffffff/transparent=true/\" title=\"Spring (Yotah's Healing Remix) — Bandcamp player\" loading=\"lazy\">\u003c/iframe>\n\u003cbr />\n\u003ca class=\"button\" href=\"spring-remix\" rel=\"history\">Full release →\u003c/a>\u003c/column-unit>\n\u003c/column-set>\u003cbr />\n\u003cbr />\n\u003chr />\u003cbr />\n\u003ccolumn-set gutter=\"2.5rem\" mobile-gutter=\"2rem\" mobile-stack=\"true\">\n\u003ccolumn-unit slot=\"0\" span=\"5\">\u003ca class=\"cover-link\" href=\"driftwood\" rel=\"history\">\u003cimg class=\"cover\" src=\"/images/driftwood.jpg\" alt=\"Driftwood\" width=\"1200\" height=\"1200\" loading=\"lazy\" />\u003c/a>\u003c/column-unit>\n\u003ccolumn-unit slot=\"1\" span=\"7\">\u003ch2 style=\"--font-scale: 0.5;\">\u003ca href=\"driftwood\" rel=\"history\">Driftwood\u003c/a>\u003c/h2>\n\u003cbr />\u003cspan class=\"caption\">Virtual Forest Records, France · 1 track\u003c/span>\n\u003cbr />\nSwiss Army knives Yotah &amp; Voicheck summon swaying rhythms, a talkative bassline and mischievous drums. Featured on \"Diplopia,\" a celebration of underground electronic music community, featuring thirteen masterful collaborative tracks from all corners of the world spanning the darkest dubstep to the most abyssal tribe.\u003cbr />\n\u003cbr />\n\u003ciframe class=\"embed embed-bandcamp\" src=\"https://bandcamp.com/EmbeddedPlayer/track=1050318584/size=small/bgcol=0d0d0d/linkcol=ffffff/transparent=true/\" title=\"Driftwood — Bandcamp player\" loading=\"lazy\">\u003c/iframe>\n\u003cbr />\n\u003ca class=\"button\" href=\"driftwood\" rel=\"history\">Full release →\u003c/a>\u003c/column-unit>\n\u003c/column-set>\u003cbr />\n\u003cbr />\n\u003chr />\u003cbr />\n\u003ccolumn-set gutter=\"2.5rem\" mobile-gutter=\"2rem\" mobile-stack=\"true\">\n\u003ccolumn-unit slot=\"0\" span=\"5\">\u003ca class=\"cover-link\" href=\"lidar\" rel=\"history\">\u003cimg class=\"cover\" src=\"/images/lidar.jpg\" alt=\"LiDAR EP\" width=\"500\" height=\"500\" loading=\"lazy\" />\u003c/a>\u003c/column-unit>\n\u003ccolumn-unit slot=\"1\" span=\"7\">\u003ch2 style=\"--font-scale: 0.5;\">\u003ca href=\"lidar\" rel=\"history\">LiDAR EP\u003c/a>\u003c/h2>\n\u003cbr />\u003cspan class=\"caption\">CRTTR · 5 tracks\u003c/span>\n\u003cbr />\nAfter experiencing numerous collective moments on dance floors, Yotah and Voicheck were inspired to share their own take on bass music. Blending fast-paced rhythms with gritty basslines and a touch of experimental sound design, 'LiDAR' carries a heavy, yet playful energy, originating from their deep-rooted friendship.\u003cbr />\n\u003cbr />\n\u003ciframe class=\"embed embed-bandcamp\" src=\"https://bandcamp.com/EmbeddedPlayer/album=962557884/size=small/bgcol=0d0d0d/linkcol=ffffff/transparent=true/\" title=\"LiDAR EP — Bandcamp player\" loading=\"lazy\">\u003c/iframe>\n\u003cbr />\n\u003ca class=\"button\" href=\"lidar\" rel=\"history\">Full release →\u003c/a>\u003c/column-unit>\n\u003c/column-set>\u003cbr />\n\u003cbr />\n\u003chr />\u003cbr />\n\u003ccolumn-set gutter=\"2.5rem\" mobile-gutter=\"2rem\" mobile-stack=\"true\">\n\u003ccolumn-unit slot=\"0\" span=\"5\">\u003ca class=\"cover-link\" href=\"this-is-fine\" rel=\"history\">\u003cimg class=\"cover\" src=\"/images/this_is_fine.jpg\" alt=\"This is Fine\" width=\"500\" height=\"500\" loading=\"lazy\" />\u003c/a>\u003c/column-unit>\n\u003ccolumn-unit slot=\"1\" span=\"7\">\u003ch2 style=\"--font-scale: 0.5;\">\u003ca href=\"this-is-fine\" rel=\"history\">This is Fine\u003c/a>\u003c/h2>\n\u003cbr />\u003cspan class=\"caption\">CRTTR · 1 track\u003c/span>\n\u003cbr />\nFeatured on \"I Wanna Be A Superstar Vol. 2\" by CRTTR, a collective based in Bern, Switzerland—a mutation with many faces, unfolding through sound, image, and genre-fluid collaborative play.\u003cbr />\n\u003cbr />\n\u003ciframe class=\"embed embed-bandcamp\" src=\"https://bandcamp.com/EmbeddedPlayer/track=3989034362/size=small/bgcol=0d0d0d/linkcol=ffffff/transparent=true/\" title=\"This is Fine — Bandcamp player\" loading=\"lazy\">\u003c/iframe>\n\u003cbr />\n\u003ca class=\"button\" href=\"this-is-fine\" rel=\"history\">Full release →\u003c/a>\u003c/column-unit>\n\u003c/column-set>\u003cbr />\n\u003cbr />\n\u003chr />\u003cbr />\n\u003ccolumn-set gutter=\"2.5rem\" mobile-gutter=\"2rem\" mobile-stack=\"true\">\n\u003ccolumn-unit slot=\"0\" span=\"5\">\u003ca class=\"cover-link\" href=\"is-like\" rel=\"history\">\u003cimg class=\"cover\" src=\"/images/is_like.jpg\" alt=\"Is Like\" width=\"500\" height=\"500\" loading=\"lazy\" />\u003c/a>\u003c/column-unit>\n\u003ccolumn-unit slot=\"1\" span=\"7\">\u003ch2 style=\"--font-scale: 0.5;\">\u003ca href=\"is-like\" rel=\"history\">Is Like\u003c/a>\u003c/h2>\n\u003cbr />\u003cspan class=\"caption\">CRTTR · 1 track\u003c/span>\n\u003cbr />\nThe CRTTR-CLB series carries the vision of exploring different ways of challenging the notion of club music. For each release we want to bring together four artists who have somehow given us a glitchy feeling on the dancefloor, while digging or in any other listening situation.\u003cbr />\n\u003cbr />\n\u003ciframe class=\"embed embed-bandcamp\" src=\"https://bandcamp.com/EmbeddedPlayer/track=2205648833/size=small/bgcol=0d0d0d/linkcol=ffffff/transparent=true/\" title=\"Is Like — Bandcamp player\" loading=\"lazy\">\u003c/iframe>\n\u003cbr />\n\u003ca class=\"button\" href=\"is-like\" rel=\"history\">Full release →\u003c/a>\u003c/column-unit>\n\u003c/column-set>\u003cbr />\n\u003cbr />\n\u003chr />\u003cbr />\n\u003ccolumn-set gutter=\"2.5rem\" mobile-gutter=\"2rem\" mobile-stack=\"true\">\n\u003ccolumn-unit slot=\"0\" span=\"5\">\u003ca class=\"cover-link\" href=\"momentum\" rel=\"history\">\u003cimg class=\"cover\" src=\"/images/momentum.jpg\" alt=\"Momentum\" width=\"1200\" height=\"1200\" loading=\"lazy\" />\u003c/a>\u003c/column-unit>\n\u003ccolumn-unit slot=\"1\" span=\"7\">\u003ch2 style=\"--font-scale: 0.5;\">\u003ca href=\"momentum\" rel=\"history\">Momentum\u003c/a>\u003c/h2>\n\u003cbr />\u003cspan class=\"caption\">1 track\u003c/span>\n\u003cbr />\nFeatured on \"Smell The Roses\" VA Compilation by 00effort, a label seeding the experimental field since 2020, based in Warsaw, Poland.\u003cbr />\n\u003cbr />\n\u003ciframe class=\"embed embed-bandcamp\" src=\"https://bandcamp.com/EmbeddedPlayer/track=3122343855/size=small/bgcol=0d0d0d/linkcol=ffffff/transparent=true/\" title=\"Momentum — Bandcamp player\" loading=\"lazy\">\u003c/iframe>\n\u003cbr />\n\u003ca class=\"button\" href=\"momentum\" rel=\"history\">Full release →\u003c/a>\u003c/column-unit>\n\u003c/column-set>\u003cbr />\n\u003cbr />\n\u003chr />\u003cbr />\n\u003ccolumn-set gutter=\"2.5rem\" mobile-gutter=\"2rem\" mobile-stack=\"true\">\n\u003ccolumn-unit slot=\"0\" span=\"5\">\u003ca class=\"cover-link\" href=\"y-fe2o3\" rel=\"history\">\u003cimg class=\"cover\" src=\"/images/y-fe2o3.jpg\" alt=\"y-Fe2O3\" width=\"1200\" height=\"1160\" loading=\"lazy\" />\u003c/a>\u003c/column-unit>\n\u003ccolumn-unit slot=\"1\" span=\"7\">\u003ch2 style=\"--font-scale: 0.5;\">\u003ca href=\"y-fe2o3\" rel=\"history\">y-Fe2O3\u003c/a>\u003c/h2>\n\u003cbr />\u003cspan class=\"caption\">CRTTR · 2 tracks\u003c/span>\n\u003cbr />\ny-Fe2O3 was composed explicitly for tape. The warm, slightly distorted sound, the soft hiss, the fluctuation of playback speed creates sonic characteristics that are missed today and are therefore deliberately simulated.\u003cbr />\n\u003cbr />\n\u003ciframe class=\"embed embed-bandcamp\" src=\"https://bandcamp.com/EmbeddedPlayer/album=3730518178/size=small/bgcol=0d0d0d/linkcol=ffffff/transparent=true/\" title=\"y-Fe2O3 — Bandcamp player\" loading=\"lazy\">\u003c/iframe>\n\u003cbr />\n\u003ca class=\"button\" href=\"y-fe2o3\" rel=\"history\">Full release →\u003c/a>\u003c/column-unit>\n\u003c/column-set>\u003cbr />\n\u003cbr />\n\u003chr />\u003cbr />\n\u003ccolumn-set gutter=\"2.5rem\" mobile-gutter=\"2rem\" mobile-stack=\"true\">\n\u003ccolumn-unit slot=\"0\" span=\"5\">\u003ca class=\"cover-link\" href=\"lone-fluke\" rel=\"history\">\u003cimg class=\"cover\" src=\"/images/lone_fluke.jpg\" alt=\"Lone Fluke\" width=\"500\" height=\"500\" loading=\"lazy\" />\u003c/a>\u003c/column-unit>\n\u003ccolumn-unit slot=\"1\" span=\"7\">\u003ch2 style=\"--font-scale: 0.5;\">\u003ca href=\"lone-fluke\" rel=\"history\">Lone Fluke\u003c/a>\u003c/h2>\n\u003cbr />\nIn collaboration with Candid Rütter, a friend and former Sound Arts Studies classmate, the two composed the approximately ten-minute, multi-channel sound piece \"Lone Fluke\".\u003cbr />\n\u003cbr />\n\u003ciframe class=\"embed embed-soundcloud\" src=\"https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/971118847%3Fsecret_token%3Ds-RwepXlcAmVq&amp;color=%23ff5500&amp;auto_play=false&amp;hide_related=false&amp;show_comments=true&amp;show_user=true&amp;show_reposts=false&amp;show_teaser=true\" title=\"Lone Fluke — SoundCloud player\" allow=\"autoplay\" loading=\"lazy\">\u003c/iframe>\n\u003cbr />\n\u003ca class=\"button\" href=\"lone-fluke\" rel=\"h 		 * started scrolling within 700ms of arriving it hauled you back to the
		 * anchor — which is what read as the page snapping on a phone, where a
		 * touch scroll begins almost immediately. Any input from the reader now
		 * wins.

		setTimeout(function() {

		}, 700);

/*
 * hero-effect.js — the home page name, rendered through a small WebGL pass.
 *
 * Inlined into index.html by build-site.mjs. No dependencies.
 *
 * The h1 keeps its real text (for selection, screen readers and the link to the
 * cover scroll) and is only made transparent once a GL context actually exists,
 * so without WebGL the page looks exactly as it does now. The glyphs are drawn
 * to a 2D canvas in the page's own font, uploaded as a texture, and sampled
 * through a slow flow field, a lens that wanders on its own, and a second lens
 * under the cursor. The first two run unattended, so the name is never still.
 *
 * Cargo re-renders pages client-side, so the effect re-mounts whenever a new h1
 * appears, and stops itself when its own h1 leaves the document.
 */
(function () {
	var PAD = 0.09; // texture margin, so the warp cannot clip the glyph edges
	var MAX_DPR = 2;

	var VERT = [
		"attribute vec2 aPos;",
		"varying vec2 vUv;",
		"void main() {",
		"	vUv = aPos * 0.5 + 0.5;",
		"	gl_Position = vec4(aPos, 0.0, 1.0);",
		"}"
	].join("\n");

	var FRAG = [
		"precision highp float;",
		"varying vec2 vUv;",
		"uniform sampler2D uTex;",
		"uniform vec3 uColor;",
		"uniform vec2 uMouse;",
		"uniform float uTime;",
		"uniform float uAspect;",
		"uniform float uAmp;",
		"uniform float uSplit;",
		"uniform float uPointer;",
		"uniform float uDrift;",
		"uniform float uAlpha;",

		"	return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);",
		"}",

		"float noise(vec2 p) {",

		"	return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),",
		"		mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);",
		"}",

		"void main() {",
		"	vec2 uv = vUv;",
		"	vec2 p = vec2(uv.x * uAspect, uv.y);",

		// Slow drifting flow field — the ambient shimmer.
		"	float nx = noise(p * 2.6 + vec2(uTime * 0.022, uTime * 0.016));",
		"	float ny = noise(p * 2.6 + vec2(uTime * -0.020, uTime * 0.013) + 37.0);",
		"	vec2 flow = (vec2(nx, ny) - 0.5) * uAmp;",

		// Soft lens that follows the pointer.
		"	vec2 d = vec2((uv.x - uMouse.x) * uAspect, uv.y - uMouse.y);",
		"	float lens = exp(-dot(d, d) * 16.0) * uPointer;",
		"	flow += normalize(d + vec2(1e-5)) * lens * uAmp * 2.6;",

		 * with no cursor on the page. Broader and weaker than the pointer's,

		 * enough that you notice it has moved rather than watching it move.

		"	float drift = exp(-dot(ad, ad) * 9.0) * uDrift;",
		"	flow += normalize(ad + vec2(1e-5)) * drift * uAmp * 1.5;",

		"	float split = uSplit * (0.35 + lens * 1.4 + drift * 0.9);",
		"	float ar = texture2D(uTex, w + vec2(split, 0.0)).a;",

			pointer += (targetPointer - pointer) * 0.06;

			/*
			 * Scrolling away distorts the name the same way the cursor does, but
			 * across the whole wordmark. Measured against the title's own position
			 * rather than a viewport fraction: 0 with the page at rest, 1 once it
			 * has scrolled clear of the top edge, whatever the viewport height.
			 */
			var rect = el.getBoundingClientRect();
			var scrolled = window.scrollY || document.documentElement.scrollTop || 0;
			var travel = rect.bottom + scrolled; // the title's bottom in page space
			var exit = travel > 0 ? scrolled / travel : 0;
			exit = exit < 0 ? 0 : exit > 1 ? 1 : exit;
			exit = reduce ? 0 : Math.pow(exit, 1.6);

			gl.useProgram(pr);
			gl.uniform1f(u.uTime, reduce ? 0 : (now - start) / 1000);
			gl.uniform1f(u.uAspect, aspect);
			gl.uniform1f(u.uAmp, (reduce ? 0.0016 : 0.0042) * (1 + exit * 6));
			gl.uniform1f(u.uSplit, 0.0014 * (1 + exit * 4));
			gl.uniform1f(u.uPointer, reduce ? 0 : pointer);
			// Always on, cursor or not — the only thing that stills it is
			// prefers-reduced-motion.
			gl.uniform1f(u.uDrift, reduce ? 0 : 1);
			gl.uniform2f(u.uMouse, mouse[0], mouse[1]);
			gl.activeTexture(gl.TEXTURE0);
			gl.bindTexture(gl.TEXTURE_2D, tex);
			gl.uniform1i(u.uTex, 0);
			gl.clearColor(0, 0, 0, 0);
			gl.clear(gl.COLOR_BUFFER_BIT);
			gl.drawArrays(gl.TRIANGLES, 0, 3);
		}

		window.addEventListener(
			"pointermove",
			function (event) {
				var rect = canvas.getBoundingClientRect();
				mouse[0] = (event.clientX - rect.left) / rect.width;
				mouse[1] = 1 - (event.clientY - rect.top) / rect.height;
				var near =
					event.clientX > rect.left - rect.width * 0.4 &&
					event.clientX < rect.right + rect.width * 0.4 &&
					event.clientY > rect.top - rect.height * 1.5 &&
					event.clientY < rect.bottom + rect.height * 1.5;
				targetPointer = near ? 1 : 0;
			},
			{ passive: true }
		);

		if (window.ResizeObserver) new ResizeObserver(resize).observe(el);
		window.addEventListener("resize", resize, { passive: true });
		if (window.IntersectionObserver) {
			new IntersectionObserver(function (entries) {
				visible = entries[0].isIntersecting;
			}).observe(el);
		}

		resize();
		if (document.fonts && document.fonts.ready) document.fonts.ready.then(resize);
		requestAnimationFrame(frame);
	}

	function scan() {
		var el = document.querySelector(".content h1");
		if (el) mount(el);
	}

	if (window.MutationObserver) {
		new MutationObserver(scan).observe(document.documentElement, {
			childList: true,
			subtree: true
		});
	}
	if (document.readyState === "loading") {
		document.addEventListener("DOMContentLoaded", scan);
	} else {
		scan();
	}
})();

		</script>
	</body>
